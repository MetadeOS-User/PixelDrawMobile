name: Compilar APK (Android 32 + 64 bits)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]          # ex.: git tag v1.0.0 && git push origin v1.0.0
  pull_request:
  workflow_dispatch:        # botão "Run workflow" na aba Actions

permissions:
  contents: write           # necessário só para anexar o APK em uma Release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip build-essential ccache cmake pkg-config \
            autoconf automake libtool libltdl-dev \
            zlib1g-dev libncurses-dev libtinfo6 libffi-dev libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 "Cython==0.29.37" virtualenv

      # Guarda o SDK/NDK do Android e o que já foi compilado.
      # A chave muda quando o buildozer.spec muda (assim o cache nunca fica velho).
      - name: Cache do Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Compilar o APK
        run: buildozer -v android debug

      - name: Mostrar as arquiteturas dentro do APK
        run: |
          for f in bin/*.apk; do
            echo "== $f"
            unzip -l "$f" | grep -E "lib/(arm64-v8a|armeabi-v7a)/libmain.so" || true
          done

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PixelDraw-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Anexar o APK na Release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
